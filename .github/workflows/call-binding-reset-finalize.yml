name: Call binding reset finalization (temporary)
on:
  push:
    branches: [codex/python-call-binding]
    paths: [.github/workflows/call-binding-reset-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply verified production reset and regenerate references
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code a17f7e76e54e86024f6d046df52396317def68bd HEAD -- . ':(exclude).github/workflows/call-binding-reset-finalize.yml'
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          payload = ''
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd7b552fea8ed09ee0eadda4f6018962b994829434f43d08061ac5ce10e3fcde5'
          Path('/tmp/reset.patch').write_bytes(patch)
          PY
          git apply --check /tmp/reset.patch
          git apply --index /tmp/reset.patch
          git rm .github/workflows/call-binding-reset-finalize.yml
          python -m pip install '.[dev]'
          python scripts/generate-reference.py
          python scripts/generate-reference.py --check
          pytest -q tests/test_taint_import_binding.py tests/test_taint_callee_resolution.py
          git add docs/reference/
          git diff --cached --check
          test "$(git write-tree)" = 0d45e4e2bc0a2b65e88aca0c50052f2cb310ee3f
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reset callee attribution budget on every taint invocation'
          test "$(git ls-remote origin refs/heads/codex/python-call-binding | cut -f1)" = "${{ github.sha }}"
          git push origin HEAD:refs/heads/codex/python-call-binding
