name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check project memory docs
        run: bash scripts/lint-project-memory.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: python scripts/sync-version.py --check
      - run: python scripts/generate-reference.py --check
      - run: python scripts/check_language_evidence.py --check
      - run: ruff check .
      - run: mypy src/
      - run: python scripts/check_quality_debt.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Test
        if: matrix.python-version != '3.12'
        run: |
          pytest tests/ -v \
            --deselect tests/test_incremental.py::TestSemanticStaleMarker::test_stale_marker_triggers_rebuild \
            --deselect tests/test_mcp_server.py::TestLoadProjectMap \
            --deselect tests/test_mcp_server.py::TestLoadContentFile
      - name: Test with per-test coverage evidence
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-branch \
            --cov-context=test \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            --deselect tests/test_incremental.py::TestSemanticStaleMarker::test_stale_marker_triggers_rebuild \
            --deselect tests/test_mcp_server.py::TestLoadProjectMap \
            --deselect tests/test_mcp_server.py::TestLoadContentFile
      - name: Upload test evidence
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-evidence-${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
            junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: test-evidence-3.12
          path: .
      - run: python benchmarks/evaluate.py --check --json
      - run: python benchmarks/evaluate_task_efficiency.py --check --json
      - run: >-
          flyto-index verify . --full-scan --strict
          --baseline .flyto-baselines/flyto-indexer.json
          --regression-only
          --report /tmp/flyto-indexer-verify.sarif
          --report-format sarif
          --json
      - name: Prove coverage-context and JUnit test impact
        run: |
          python - <<'PY'
          from src.test_evidence import (
              build_test_impact_evidence,
              parse_sqlite_contexts,
          )
          from src.tools.coverage_intel import coverage_report
          from pathlib import Path

          assert Path(".coverage").is_file(), "hidden coverage DB was not transferred"
          contexts = parse_sqlite_contexts(
              ".coverage",
              ".",
              target_files=["src/engine.py"],
          )
          assert contexts, "coverage artifact has no per-test contexts"
          path, line_map = next(
              (path, lines) for path, lines in contexts.items() if lines
          )
          line = next(iter(line_map))
          evidence = build_test_impact_evidence(
              ".",
              "sqlite",
              ".coverage",
              {path: [line]},
          )
          assert evidence["coverage_artifact"]["fresh"], evidence
          assert evidence["junit_artifacts"], evidence
          assert evidence["impacted_tests"], evidence
          assert evidence["confidence"] in {"high", "medium"}, evidence
          report = coverage_report("flyto-indexer")
          assert "error" not in report, report
          assert report["data_source"] == "sqlite", report
          assert report["coverage_artifact"]["fresh"], report
          PY

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, verify]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Verify wheel runtime dependency boundary
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel built"
          with zipfile.ZipFile(wheels[0]) as zf:
              metadata_name = next(name for name in zf.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = zf.read(metadata_name).decode()
          runtime_requires = [
              line for line in metadata.splitlines()
              if line.startswith("Requires-Dist:") and "extra ==" not in line
          ]
          assert runtime_requires == ["Requires-Dist: pyyaml>=6.0.3"], runtime_requires
          PY
      - name: Wheel policy smoke test
        run: |
          python -m venv /tmp/flyto-wheel-smoke
          /tmp/flyto-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/flyto-wheel-smoke/bin/flyto-index --help
          /tmp/flyto-wheel-smoke/bin/python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from flyto_indexer.analyzer.rules import check_rules

          with TemporaryDirectory() as tmpdir:
              root = Path(tmpdir)
              (root / ".flyto-rules.yaml").write_text(
                  "architecture:\n"
                  "  - rule: no debug prints\n"
                  "    grep_deny:\n"
                  "      - pattern: debug_print\\(\n"
                  "        glob: '*.py'\n",
                  encoding="utf-8",
              )
              (root / "app.py").write_text("print('ok')\n", encoding="utf-8")
              result = check_rules(root)
              assert result["total_rules"] == 1, result
              assert result["rules_checked"] == 1, result
              assert result["total_violations"] == 0, result
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
