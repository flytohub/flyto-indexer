name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check project memory docs
        run: bash scripts/lint-project-memory.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install ruff mypy
      - run: ruff check src/
      - run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      # Seven tests assume a writable HOME / TMPDIR that the hosted runners
      # expose via a systemd-private bind mount, which rejects writes. Deselect
      # until the tests are rewritten to use pytest's tmp_path fixture.
      - run: |
          pytest tests/ -v \
            --deselect tests/test_incremental.py::TestSemanticStaleMarker::test_stale_marker_triggers_rebuild \
            --deselect tests/test_mcp_server.py::TestLoadProjectMap \
            --deselect tests/test_mcp_server.py::TestLoadContentFile

  verify:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: flyto-index verify . --full-scan --strict --report /tmp/flyto-indexer-verify.sarif --report-format sarif --json

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, verify]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Verify wheel has no runtime dependencies
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel built"
          with zipfile.ZipFile(wheels[0]) as zf:
              metadata_name = next(name for name in zf.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = zf.read(metadata_name).decode()
          runtime_requires = [
              line for line in metadata.splitlines()
              if line.startswith("Requires-Dist:") and "extra ==" not in line
          ]
          assert runtime_requires == [], runtime_requires
          PY
      - name: No-deps wheel smoke test
        run: |
          python -m venv /tmp/flyto-wheel-smoke
          /tmp/flyto-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/flyto-wheel-smoke/bin/flyto-index --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
