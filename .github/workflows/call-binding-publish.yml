name: Call binding source publication (temporary)
on:
  push:
    branches: [codex/python-call-binding]
    paths: [.github/workflows/call-binding-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply only the locally tested source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 6758b92bf9cf010a50effd7ab3aed3c3a2aa7dfb HEAD -- . ':(exclude).github/call-binding.transport-*' ':(exclude).github/workflows/call-binding-publish.yml'
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          payload = ''.join(Path(f'.github/call-binding.transport-{i}').read_text().strip() for i in (1, 2, 3))
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'dbe2130b96a178df85b9bcb5f3e17db9f812a3170cc21a4fae628eeba45110ef'
          Path('/tmp/call-binding.patch').write_bytes(patch)
          PY
          git apply --check /tmp/call-binding.patch
          git apply --index /tmp/call-binding.patch
          git rm .github/call-binding.transport-{1,2,3} .github/workflows/call-binding-publish.yml
          python -m pip install '.[dev]'
          python scripts/generate-reference.py
          python scripts/generate-reference.py --check
          bash scripts/lint-project-memory.sh
          git add docs/reference/
          git diff --cached --check
          test "$(git write-tree)" = 89baaec4d67b90cfbe707084778704f990fa471f
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind Python cross-file calls and preserve bounded taint evidence'
          test "$(git ls-remote origin refs/heads/codex/python-call-binding | cut -f1)" = "${{ github.sha }}"
          git push origin HEAD:refs/heads/codex/python-call-binding
