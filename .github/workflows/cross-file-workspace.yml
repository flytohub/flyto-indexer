name: Cross-file workspace (temporary)
on:
  push:
    branches: [codex/cross-file-evidence]
    paths: [.github/workflows/cross-file-workspace.yml]
permissions:
  contents: write
concurrency:
  group: cross-file-reviewed-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply hash-verified production delta on the unchanged base
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 6758b92bf9cf010a50effd7ab3aed3c3a2aa7dfb HEAD -- . ':(exclude).github/workflows/cross-file-workspace.yml' ':(exclude).cross-file-patch'
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = Path('.cross-file-patch').read_bytes()
          assert len(encoded) == 14336
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 45092
          assert hashlib.sha256(patch).hexdigest() == '5bf8e73a1125b05a956682205aa3bbdb62ee5790b0f1503e186bd0d08888d83d'
          Path('/tmp/cross-file.patch').write_bytes(patch)
          PY
          git apply --check /tmp/cross-file.patch
          git apply --index /tmp/cross-file.patch
          git rm .cross-file-patch .github/workflows/cross-file-workspace.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve resolved cross-file taint evidence and bounded analysis state'
      - name: Regenerate references using the existing repository generator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3
          python scripts/generate-reference.py
          python scripts/generate-reference.py --check
          bash scripts/lint-project-memory.sh
          git add docs/reference
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'docs: regenerate cross-file analysis references'; fi
      - name: Publish reviewed branch without force or concurrent overwrite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/cross-file-evidence | cut -f1)" = "${{ github.sha }}"
          git push origin HEAD:refs/heads/codex/cross-file-evidence
          mkdir -p /tmp/cross-file-final
          git rev-parse HEAD > /tmp/cross-file-final/commit.txt
          git rev-parse HEAD^{tree} > /tmp/cross-file-final/tree.txt
          git archive --format=tar.gz HEAD > /tmp/cross-file-final/source.tar.gz
          (cd /tmp/cross-file-final && sha256sum source.tar.gz > manifest.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-file-final-source
          path: /tmp/cross-file-final
          retention-days: 2
          if-no-files-found: error
      - name: Package public pinned validation tools for the offline workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cross-file-tools
          python -m pip download --only-binary=:all: --python-version 3.13 --implementation cp --abi cp313 --dest /tmp/cross-file-tools ruff==0.16.7 mypy==2.3.0 types-PyYAML hypothesis hatchling build
          (cd /tmp/cross-file-tools && sha256sum *.whl > manifest.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-file-validation-tools
          path: /tmp/cross-file-tools
          retention-days: 2
          if-no-files-found: error
