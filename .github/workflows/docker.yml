name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (reproducibility check)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: flyto-indexer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify bundled scanner binaries
        run: |
          docker run --rm --entrypoint semgrep  flyto-indexer:${{ github.sha }} --version
          docker run --rm --entrypoint checkov  flyto-indexer:${{ github.sha }} --version
          docker run --rm --entrypoint cat      flyto-indexer:${{ github.sha }} /app/NOTICE | head -n 5

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: flyto-indexer:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: true
          # pip bundles a third-party component SBOM, not an environment
          # inventory. Runtime package versions are pinned and asserted in the
          # Dockerfile; scanning this nested SBOM creates known false positives.
          skip-files: /usr/local/lib/python3.12/site-packages/pip/_vendor/bom.cdx.json

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy
