name: Public proof

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/reproduce_impact_case.py'
      - 'docs/CASE_STUDY_FASTAPI.md'
      - 'docs/evidence/fastapi-full-stack-0.10.0.json'
      - '.github/workflows/public-proof.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/reproduce_impact_case.py'
      - 'docs/CASE_STUDY_FASTAPI.md'
      - 'docs/evidence/fastapi-full-stack-0.10.0.json'
      - '.github/workflows/public-proof.yml'
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fastapi-full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]"
      - run: >-
          python scripts/reproduce_impact_case.py
          --check-snapshot
          --output public-proof.json
      - name: Publish proof summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          result = json.load(open("public-proof.json", encoding="utf-8"))
          text = result["text_search"]
          proof = result["proof"]
          print("# Pinned real-repository impact proof\n")
          print(f"Source commit: `{result['case']['commit']}`\n")
          print(f"Evidence fingerprint: `{result['evidence_fingerprint']}`\n")
          print(f"- Text search: {text['matching_lines']} lines in {len(text['matching_files'])} file")
          print(
              "- Transitive functions outside those files: "
              f"{len(proof['functions_in_files_missed_by_text_search'])}"
          )
          print(f"- Proof passed: `{proof['pass']}`")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-proof-${{ github.sha }}
          path: public-proof.json
          retention-days: 30
          if-no-files-found: error
