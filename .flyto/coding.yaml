# Source-owned verification policy for `flyto-ai code-mcp`
# (`flyto_ai.coding.checks.load_project_config`).
#
# This exact repository-relative path is the only committed file under
# `.flyto/`. Every other `.flyto/` path is generated runtime state: it stays
# ignored by `.gitignore` and is still classified as generated by
# `_is_generated_change_path` in `src/verify.py`.
#
# Checks are argv-only, bounded, and offline. Network-dependent gates (pinned
# public impact case, package build, PyPI publication) are release-time
# concerns and are deliberately not declared here.
version: flyto.coding-config.v1

checks:
  - name: project-memory
    argv: [bash, scripts/lint-project-memory.sh]
    timeout_seconds: 120
    required: true
  - name: version-metadata
    argv: [python, scripts/sync-version.py, --check]
    timeout_seconds: 120
    required: true
  - name: generated-reference
    argv: [python, scripts/generate-reference.py, --check]
    timeout_seconds: 300
    required: true
  - name: language-evidence
    argv: [python, scripts/check_language_evidence.py, --check]
    timeout_seconds: 120
    required: true
  - name: quality-debt
    argv: [python, scripts/check_quality_debt.py]
    timeout_seconds: 300
    required: true
  - name: fatal-lint
    argv: [ruff, check, ., --select, "E9,F63,F7,F82"]
    timeout_seconds: 300
    required: true
  - name: tests
    argv: [bash, scripts/test_fast.sh]
    timeout_seconds: 900
    required: true

# The Claude service adapter intentionally cannot attach capabilities, so this
# contract stays satisfiable without any of them.
capabilities: []
